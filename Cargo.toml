[package]
name = "fastview"
version = "0.4.0"
description = "A fast, lightweight, and modern image viewer built with Rust"
authors = ["FastView Team"]
license = "MIT"
repository = "https://github.com/wsyqn6/fastview"
documentation = "https://wsyqn6.github.io/fastview"
keywords = ["image", "viewer", "gui", "lightweight"]
categories = ["multimedia::images", "gui"]
edition = "2024"
rust-version = "1.88"
publish = false
build = "build.rs"

[lints.rust]
dead_code = "allow"

[lints.clippy]
too_many_arguments = "allow"

[dependencies]
gpui = { package = "gpui-unofficial", version = "1.28.1" }
gpui_platform = { package = "gpui-platform-gpui-unofficial", version = "1.28.1" }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
    "gif",
    "bmp",
    "tiff",
] }
exif = { package = "kamadak-exif", version = "0.6" }
# 只解析无加密 zip 的 deflate 条目；解压到临时目录后复用现有路径解码链路
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
resvg = "0.46"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
# WIC 缩放解码（DCT 1/2ⁿ）与 shell 缩略图缓存，windows-sys 的绑定不够用
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# 当前分支以开发效率优先，release 暂不做体积优化
[profile.release]
codegen-units = 16
