[package]
name = "gpui-spike"
version = "0.1.0"
edition = "2024"
publish = false

# 独立 workspace，避免拖慢 fastview 主构建
[workspace]

[dependencies]
gpui = { package = "gpui-unofficial", version = "1.28.1" }
gpui_platform = { package = "gpui-platform-gpui-unofficial", version = "1.28.1" }
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
    "gif",
    "bmp",
    "tiff",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
] }
# WIC 缩放解码（DCT 1/2ⁿ）与 shell 缩略图缓存，windows-sys 的绑定不够用
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }

# spike 只验证能力，不做体积优化
[profile.release]
codegen-units = 16
