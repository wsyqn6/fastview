name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  PROJECT_NAME: fastview

jobs:
  # Windows 发布：gpui 线当前仅 Windows 可发布
  release-windows:
    name: Release Windows
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Update version
        shell: pwsh
        run: |
          $VERSION = $env:GITHUB_REF_NAME -replace '^v', ''
          (Get-Content Cargo.toml) -replace '^version = ".*"', "version = `"$VERSION`"" | Set-Content Cargo.toml

      - name: Build release
        run: cargo build --release

      - name: Create package
        shell: pwsh
        run: |
          Compress-Archive -Path "target\release\${{ env.PROJECT_NAME }}.exe" -DestinationPath "target\release\${{ env.PROJECT_NAME }}-windows-x86_64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: target/release/${{ env.PROJECT_NAME }}-windows-x86_64.zip
          retention-days: 30

  # 创建 GitHub Release
  create-release:
    name: Create GitHub Release
    needs: [release-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2.0.8
        with:
          files: |
            artifacts/release-windows/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
