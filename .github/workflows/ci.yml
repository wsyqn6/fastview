name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # 代码质量检查 + 测试（gpui 线 Windows 优先）
  check:
    name: Check & Test
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy (includes cargo check)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --bin fastview

  # 发布构建：push main 时产出验收包，正式发布由 v* tag 触发 release.yml
  build-release:
    name: Build Release (Windows)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fastview-windows
          path: target/release/fastview.exe
          retention-days: 7
